version: "3.9"

networks:
  shopease-network:
    driver: bridge

volumes:
  auth-mongo-data:
  product-mongo-data:
  order-mongo-data:
  cart-mongo-data:
  profile-mongo-data:
  notification-mongo-data:

services:
  # ─────────────────────────────────────────────
  # MongoDB Instances (one per service)
  # ─────────────────────────────────────────────
  auth-mongo:
    image: mongo:7.0-jammy
    container_name: auth-mongo
    restart: unless-stopped
    volumes:
      - auth-mongo-data:/data/db
    networks:
      - shopease-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  product-mongo:
    image: mongo:7.0-jammy
    container_name: product-mongo
    restart: unless-stopped
    volumes:
      - product-mongo-data:/data/db
    networks:
      - shopease-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  order-mongo:
    image: mongo:7.0-jammy
    container_name: order-mongo
    restart: unless-stopped
    volumes:
      - order-mongo-data:/data/db
    networks:
      - shopease-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  cart-mongo:
    image: mongo:7.0-jammy
    container_name: cart-mongo
    restart: unless-stopped
    volumes:
      - cart-mongo-data:/data/db
    networks:
      - shopease-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  profile-mongo:
    image: mongo:7.0-jammy
    container_name: profile-mongo
    restart: unless-stopped
    volumes:
      - profile-mongo-data:/data/db
    networks:
      - shopease-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  notification-mongo:
    image: mongo:7.0-jammy
    container_name: notification-mongo
    restart: unless-stopped
    volumes:
      - notification-mongo-data:/data/db
    networks:
      - shopease-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Backend Microservices
  # ─────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      PORT: "4001"
      NODE_ENV: "production"
      MONGO_URI: "mongodb://auth-mongo:27017/auth_db"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      ALLOWED_ORIGINS: "${FRONTEND_URL}"
      FRONTEND_URL: "${FRONTEND_URL}"
      LOG_LEVEL: "info"
    ports:
      - "4001:4001"
    depends_on:
      auth-mongo:
        condition: service_healthy
    networks:
      - shopease-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    environment:
      PORT: "4002"
      NODE_ENV: "production"
      MONGO_URI: "mongodb://product-mongo:27017/product_db"
      JWT_SECRET: "${JWT_SECRET}"
      ALLOWED_ORIGINS: "${FRONTEND_URL}"
      FRONTEND_URL: "${FRONTEND_URL}"
      LOG_LEVEL: "info"
    ports:
      - "4002:4002"
    depends_on:
      product-mongo:
        condition: service_healthy
    networks:
      - shopease-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      PORT: "4003"
      NODE_ENV: "production"
      MONGO_URI: "mongodb://order-mongo:27017/order_db"
      JWT_SECRET: "${JWT_SECRET}"
      PRODUCT_SERVICE_URL: "http://product-service:4002"
      NOTIFICATION_SERVICE_URL: "http://notification-service:4006"
      ALLOWED_ORIGINS: "${FRONTEND_URL}"
      FRONTEND_URL: "${FRONTEND_URL}"
      LOG_LEVEL: "info"
    ports:
      - "4003:4003"
    depends_on:
      order-mongo:
        condition: service_healthy
      product-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - shopease-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4003/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    container_name: cart-service
    restart: unless-stopped
    environment:
      PORT: "4004"
      NODE_ENV: "production"
      MONGO_URI: "mongodb://cart-mongo:27017/cart_db"
      JWT_SECRET: "${JWT_SECRET}"
      PRODUCT_SERVICE_URL: "http://product-service:4002"
      ALLOWED_ORIGINS: "${FRONTEND_URL}"
      FRONTEND_URL: "${FRONTEND_URL}"
      LOG_LEVEL: "info"
    ports:
      - "4004:4004"
    depends_on:
      cart-mongo:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - shopease-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4004/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  user-profile-service:
    build:
      context: ./services/user-profile-service
      dockerfile: Dockerfile
    container_name: user-profile-service
    restart: unless-stopped
    environment:
      PORT: "4005"
      NODE_ENV: "production"
      MONGO_URI: "mongodb://profile-mongo:27017/profile_db"
      JWT_SECRET: "${JWT_SECRET}"
      ALLOWED_ORIGINS: "${FRONTEND_URL}"
      FRONTEND_URL: "${FRONTEND_URL}"
      LOG_LEVEL: "info"
    ports:
      - "4005:4005"
    depends_on:
      profile-mongo:
        condition: service_healthy
    networks:
      - shopease-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4005/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    environment:
      PORT: "4006"
      NODE_ENV: "production"
      MONGO_URI: "mongodb://notification-mongo:27017/notification_db"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_SECURE: "${SMTP_SECURE}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      ALLOWED_ORIGINS: "${FRONTEND_URL}"
      FRONTEND_URL: "${FRONTEND_URL}"
      LOG_LEVEL: "info"
    ports:
      - "4006:4006"
    depends_on:
      notification-mongo:
        condition: service_healthy
    networks:
      - shopease-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4006/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ─────────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
        - REACT_APP_AUTH_SERVICE_URL: http://auth-service:4001
        - REACT_APP_PRODUCT_SERVICE_URL: http://product-service:4002
        - REACT_APP_ORDER_SERVICE_URL: http://order-service:4003
        - REACT_APP_CART_SERVICE_URL: http://cart-service:4004
        - REACT_APP_PROFILE_SERVICE_URL: http://user-profile-service:4005
        - REACT_APP_NOTIFICATION_SERVICE_URL: http://notification-service:4006
        - REACT_APP_APP_NAME: ShopEase
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - shopease-network

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =============================
    # API ROUTING (IMPORTANT)
    # =============================

    location /api/auth/ {
        proxy_pass http://auth-service:4001/;
    }

    location /api/products/ {
        proxy_pass http://product-service:4002/;
    }

    location /api/orders/ {
        proxy_pass http://order-service:4003/;
    }

    location /api/cart/ {
        proxy_pass http://cart-service:4004/;
    }

    location /api/profile/ {
        proxy_pass http://user-profile-service:4005/;
    }

    location /api/notification/ {
        proxy_pass http://notification-service:4006/;
    }

    # =============================
    # SPA HANDLING
    # =============================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =============================
    # PERFORMANCE
    # =============================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # =============================
    # SECURITY
    # =============================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}